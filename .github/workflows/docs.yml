# Build Sphinx HTML + PDF, publish HTML to GitHub Pages, and keep zip artifacts.
#
# Repo setup (required or deploy-pages fails with HTTP 404):
#   Settings → Pages → Build and deployment → Source: GitHub Actions → Save.
# Private repos need a GitHub plan that includes Pages for private repositories.
# You need admin access to the repo to enable Pages.
#
# Releases: each successful PDF build creates a tagged release with the PDF asset.
# Add more assets later under "Create GitHub Release with PDF" (wheels, models, …).
name: Documentation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Pages: do not cancel in-flight deployments; serialize deploys.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write # releases + PDF assets (deploy-pages still uses pages + id-token)
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[docs]"

      - name: Install LaTeX (for PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-fonts-recommended \
            texlive-latex-recommended \
            texlive-latex-extra

      - name: Build HTML
        working-directory: docs
        run: make html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

      - name: Build PDF (LaTeX)
        id: pdf
        continue-on-error: true
        working-directory: docs
        run: make latexpdf

      - name: Upload HTML artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/build/html/

      - name: Upload PDF artifact
        if: steps.pdf.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf
          path: docs/build/latex/*.pdf

      - name: Stage PDF for release (stable filename)
        if: steps.pdf.outcome == 'success'
        run: |
          set -e
          shopt -s nullglob
          pdfs=(docs/build/latex/*.pdf)
          if [ ${#pdfs[@]} -eq 0 ]; then
            echo "No PDF found under docs/build/latex/"
            exit 1
          fi
          cp "${pdfs[0]}" bppm-dem-sm-documentation.pdf

      - name: Create GitHub Release with PDF
        if: steps.pdf.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: docs-pdf-${{ github.run_id }}-${{ github.run_attempt }}
          name: Documentation PDF (${{ github.ref_name }} @ ${{ github.sha }})
          generate_release_notes: true
          body: |
            Sphinx PDF documentation for commit `${{ github.sha }}`.

            Later builds can attach wheels and model artifacts here.
          files: bppm-dem-sm-documentation.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
